[server]
http_port = 3000
domain = localhost

[security]
admin_user = admin
admin_password = admin
allow_embedding = true

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[unified_alerting]
enabled = true

[feature_toggles]
enable = traceqlEditor

[log]
mode = console
level = info

[panels]
enable_alpha = true

[explore]
enabled = true

[help]
enabled = true

[profile]
enabled = true

[query_history]
enabled = true

[tracing]
enabled = true